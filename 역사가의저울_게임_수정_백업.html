<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사가의 저울 · 같은 사건, 다른 해석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#12141f; --panel:#1b2033; --panel2:#232a42; --panel3:#2c3455;
  --gold:#ffb648; --mint:#35e6c4; --coral:#ff5d7a; --blue:#5aa9e6;
  --text:#eef1f8; --muted:#9fabce; --line:#3a4266;
}
*{box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);}
#app{
  font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
  max-width:900px;margin:0 auto;padding:14px 14px 60px;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,182,72,0.10), transparent 60%),
    var(--bg);
  min-height:100vh;
}
img{image-rendering:pixelated;image-rendering:crisp-edges;}
.pixel-panel{
  background:var(--panel);
  border:3px solid var(--line);
  border-radius:10px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.03), 0 4px 0 rgba(0,0,0,0.35);
  padding:16px;
}
.header-bar{
  display:flex;align-items:center;gap:10px;
  padding:8px 4px 14px;
}
.header-bar img.scale{width:34px;height:34px;}
.header-bar .title-line{font-weight:800;color:var(--gold);font-size:15px;letter-spacing:0.5px;}
.header-bar .sub-line{color:var(--muted);font-size:12px;}
.progress-row{display:flex;gap:4px;margin:6px 0 18px;flex-wrap:wrap;}
.progress-dot{
  flex:1;min-width:0;text-align:center;font-size:10px;padding:6px 2px;
  border-radius:6px;background:var(--panel2);color:var(--muted);
  border:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.progress-dot.active{background:var(--gold);color:#231a08;font-weight:700;border-color:var(--gold);}
.progress-dot.done{background:var(--panel3);color:var(--mint);border-color:var(--mint);}
.screen{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
h2.scene-title{color:var(--gold);font-size:19px;margin:0 0 4px;}
h3.card-title{color:var(--text);font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
.badge{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--panel3);color:var(--mint);border:1px solid var(--mint);
  font-weight:700;
}
.badge.era{color:var(--gold);border-color:var(--gold);}
.badge.recon{color:var(--muted);border-color:var(--line);background:transparent;}
p{line-height:1.65;font-size:14.5px;color:var(--text);}
.muted{color:var(--muted);font-size:13px;}
.small{font-size:12.5px;}
.card-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
.portrait-box{
  flex:0 0 auto;text-align:center;
}
.portrait-box img.portrait{
  width:96px;height:96px;border-radius:10px;border:3px solid var(--line);
  background:#0d0f18;
}
.portrait-box .name{font-size:12px;margin-top:4px;color:var(--muted);font-weight:700;}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0;color:var(--muted);}
.info-grid b{color:var(--text);}
.quote-box{
  background:#151a2c;border-left:4px solid var(--gold);
  padding:10px 12px;margin:10px 0;border-radius:4px;font-size:14px;
  font-style:italic;color:#ffe4b0;
}
.helpword{font-size:12px;color:var(--muted);background:var(--panel2);padding:6px 10px;border-radius:6px;margin:8px 0;}
.helpword-title{display:block;color:var(--mint);font-weight:800;font-size:11.5px;letter-spacing:0.3px;margin-bottom:3px;}
.helpword-line{margin-top:2px;}
.excerpt-label{display:block;font-size:11.5px;color:var(--blue);font-weight:700;margin:10px 0 -4px;}
.src-explain-label{display:block;font-size:11.5px;color:var(--mint);font-weight:700;margin:2px 0 4px;}
.excerpt-note{font-size:12px;color:var(--muted);margin:2px 0 8px;}
.read-questions{border-color:var(--mint) !important;}
.read-questions .tag{color:var(--mint) !important;}
.read-questions ol{margin:6px 0 0;padding-left:18px;}
.read-questions li{margin-bottom:3px;}
.source-block{margin-top:10px;font-size:12px;color:var(--muted);background:var(--panel2);padding:8px 10px;border-radius:6px;}
.source-block a{color:var(--blue);}
.source-label{color:var(--blue);font-weight:700;margin-right:4px;}
.fill-grid{margin:8px 0;}
.fill-grid input{margin-bottom:8px;}
.id-card{background:var(--panel2);border-radius:10px;padding:16px;margin:18px 0;text-align:left;max-width:420px;margin-left:auto;margin-right:auto;}
.id-title{font-weight:800;color:var(--gold);font-size:14px;margin-bottom:10px;text-align:center;}
.id-row{display:flex;gap:8px;margin-bottom:10px;}
.id-row input{width:auto;flex:1;}
.id-pair{display:flex;gap:16px;flex-wrap:wrap;}
.id-pair-col{flex:1;min-width:180px;}
.id-pair-label{font-weight:800;color:var(--mint);font-size:12.5px;margin-bottom:6px;text-align:center;}
.quiz-block{margin-bottom:14px;}
.order-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13.5px;}
.order-row select{width:56px;background:#0f1220;border:2px solid var(--line);color:var(--text);border-radius:6px;padding:6px;font-family:inherit;}
.demo-box{
  background:linear-gradient(180deg, rgba(90,169,230,0.15), rgba(90,169,230,0.05));
  border:2px dashed var(--blue);border-radius:8px;padding:10px 12px;margin:12px 0;
}
.demo-box .tag{color:var(--blue);font-weight:800;font-size:12px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
.chip{
  background:var(--panel2);border:1.5px solid var(--line);color:var(--text);
  padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .15s;
}
.chip:hover{border-color:var(--mint);}
.chip.selected{background:var(--mint);color:#062b26;border-color:var(--mint);font-weight:700;}
.chip.wide{border-radius:8px;text-align:left;}
textarea, input[type=text]{
  width:100%;background:#0f1220;border:2px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;
}
textarea:focus,input:focus{outline:none;border-color:var(--gold);}
label.field-label{display:block;font-size:12.5px;color:var(--mint);font-weight:700;margin:12px 0 4px;}
.evidence-note{font-size:12px;color:var(--muted);margin-top:4px;}
.mc-options{display:flex;flex-direction:column;gap:8px;margin:8px 0;}
.mc-opt{
  background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:10px 12px;
  cursor:pointer;font-size:13.5px;
}
.mc-opt:hover{border-color:var(--gold);}
.mc-feedback{font-size:12.5px;margin-top:6px;padding:8px 10px;border-radius:6px;}
.mc-feedback.recheck{background:rgba(255,93,122,0.12);color:#ffb3c2;border:1px solid var(--coral);}
.mc-feedback.ok{background:rgba(53,230,196,0.12);color:#a6f5e6;border:1px solid var(--mint);}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
.sprite-btn{border:none;background:none;cursor:pointer;padding:0;image-rendering:pixelated;}
.sprite-btn img{height:38px;display:block;}
.sprite-btn:active img{filter:brightness(0.85);}
.sprite-btn:disabled{cursor:not-allowed;}
.sprite-btn:disabled img{opacity:0.35;}
.css-btn{
  font-family:inherit;font-weight:800;font-size:14px;color:#fff;cursor:pointer;
  padding:9px 22px;border-radius:9px;border:none;
  box-shadow: 0 4px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
}
.css-btn.gold{background:linear-gradient(180deg,#ffcd7a,#e8961f);color:#2b1a02;}
.css-btn.mint{background:linear-gradient(180deg,#5cf0d3,#1fae91);color:#04241d;}
.css-btn.neutral{background:var(--panel3);color:var(--text);border:1.5px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,0.35);}
.css-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.35);}
.css-btn:disabled{opacity:0.4;cursor:not-allowed;}
.doc-icon{width:40px;}
.mission-quote{
  background:var(--panel2);border:2px solid var(--gold);border-radius:10px;
  padding:14px;font-size:15.5px;font-weight:700;color:#ffe9c2;margin:14px 0;
}
.divider{height:1px;background:var(--line);margin:16px 0;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab{
  flex:1;text-align:center;padding:8px;border-radius:8px 8px 0 0;
  background:var(--panel2);color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;
  border:1px solid var(--line);border-bottom:none;
}
.tab.active{background:var(--panel);color:var(--gold);}
.result-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
.result-table th,.result-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
.result-table th{background:var(--panel2);color:var(--gold);}
.title-screen{text-align:center;padding:30px 10px;}
.title-screen img.logo{max-width:340px;width:90%;}
.title-screen .scale-big{width:70px;margin:10px auto;display:block;}
.role-card{background:var(--panel2);border-radius:10px;padding:14px;margin:18px 0;font-size:13.5px;color:var(--muted);text-align:left;}
.floating-tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px;}
.tool-link{font-size:11.5px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;}
.printout{white-space:pre-wrap;font-size:12.5px;background:#0d0f18;padding:12px;border-radius:8px;border:1px solid var(--line);}
.charcard{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:10px;}
.charcard img{width:56px;height:56px;border-radius:8px;flex:0 0 auto;}
.charcard .body{font-size:12.5px;}
.warn-banner{background:rgba(255,182,72,0.1);border:1px solid var(--gold);color:#ffe0a3;font-size:12.5px;padding:8px 10px;border-radius:8px;margin-bottom:12px;}
@media print{
  .nav-row,.progress-row,.header-bar,.floating-tools{display:none !important;}
}

</style>
</head>

function mcSelectBlock(label, options, stateKey, pickFnName){
  const s = state.notes;
  const chosen = s[stateKey];
  const chosenOpt = options.find(o=>o.t===chosen);
  return `
    <label class="field-label">${esc(label)}</label>
    <div class="mc-options">
      ${options.map((o,i)=>`<div class="mc-opt ${chosen===o.t?'selected':''}" style="${chosen===o.t?'border-color:var(--gold);':''}" onclick="${pickFnName}(${i})">${esc(o.t)}</div>`).join('')}
    </div>
    ${chosen ? `<div class="mc-feedback ${chosenOpt && chosenOpt.ok ? 'ok':'recheck'}">${chosenOpt && chosenOpt.ok ? '좋습니다.' : '다시 한번 자료를 살펴볼까요?'}</div>` : ''}
  `;
}

    {img:A.shinchaeho_face, name:'신채호', crit: s.d3_criteria||'(3장에서 작성)', exp: s.d3_explain||'(3장에서 작성)'},
    {img:A.modern_face, name:'최종석', crit: s.d4_criteria||'(4장에서 작성)', exp: s.d4_explain||'(4장에서 작성)'},
  ];
  return `
  <div class="screen">
    ${header('마무리 · 다음 임무')}
    ${progressRow()}
    <h2 class="scene-title">네 인물의 기준 → 설명, 다시 보기</h2>
    <div class="pixel-panel">
      ${cards.map(c=>`
        <div class="charcard">
          <img src="${c.img}">
          <div class="body"><b>${c.name}</b><br><span class="muted">기준:</span> ${esc(c.crit)}<br><span class="muted">설명:</span> ${esc(c.exp)}</div>
        </div>`).join('')}
      <div class="divider"></div>
      <p>개인 기록에 <b>질문·답·근거·연결 이유</b>가 있는지 스스로 점검해 보세요.</p>
      <label class="field-label">'역사 설명을 읽을 때 무엇을 함께 봐야 할까?' — 한 문장으로 남겨 보세요</label>
      <textarea rows="2" oninput="s('closing', this.value);refreshClosingGate()">${esc(s.closing)}</textarea>
      <div class="demo-box" style="border-color:var(--mint);text-align:center;">
        <img src="${A.scroll_icon}" style="width:44px;margin-bottom:6px;">
        <p style="margin:0;font-weight:700;color:var(--mint);">다음 시간에는 여러분이 찾은 기준과 근거를 글로 설명해 봅시다.</p>
        <p class="small muted" style="margin:4px 0 0;">13차시 — 같은 사건, 다른 해석 : 무엇을 중요하게 보았을까?</p>
      </div>
    </div>

    <div class="pixel-panel" style="margin-top:14px;">
      <h3 class="card-title"><img class="doc-icon" src="${A.doc_card}"> 내 조사 기록 인쇄·복사용 요약</h3>
      <p class="small muted">아래 내용을 인쇄하거나 전체 선택해 복사한 뒤 붙여넣어 제출할 수 있습니다.</p>
      <div class="printout" id="printout"></div>
      <div style="text-align:center;margin-top:10px;">
        <button class="css-btn mint" onclick="copyReport()">복사하기</button>
        <button class="css-btn gold" onclick="window.print()" style="margin-left:8px;">인쇄하기</button>
      </div>
    </div>
    ${navRow({gateId:'closingNextBtn', gateInitiallyDisabled: !closingComplete(s), disabledHint: '빈칸을 채워야 다음으로 넘어갈 수 있습니다.'})}
  </div>`;
}

function buildPrintout(){
  const s = state.notes;
  const lines = [
"역사가의 저울 — 12차시 개인 조사 기록",
`신현중학교 3학년 나: ${s.id_ban||'__'}반 ${s.id_num||'__'}번 ${s.id_name||'(이름 미작성)'} / 짝: ${s.id2_ban||'__'}반 ${s.id2_num||'__'}번 ${s.id2_name||'(이름 미작성)'}`,
"",
"[1. 당대의 두 시각]",
"김부식 — 기준: 국경의 안정 / 설명: 우호 관계를 긍정적으로 평가",
`윤언이 — 근거: ${s.d1_evidence==='a' ? '"우리가 어찌 도리어 그들의 신하가 될 수 있겠습니까"' : (s.d1_evidence==='b' ? '"여진족은 본래 우리 고려를 부모의 나라로 섬기고 있었습니다"' : '(미선택)')}`,
`윤언이 — 중요하게 본 점: ${s.d1_point||'(미작성)'}`,
"",
"[2. 내 질문]",
`질문: ${s.q_text||'(미작성)'}`,
"",
"[3. 후대 역사가의 설명표]",
`신채호 — 기준: ${s.d3_criteria||'(미작성)'} / 설명: ${s.d3_explain||'(미작성)'}`,
`최종석 — 기준: ${s.d4_criteria||'(미작성)'} / 설명: ${s.d4_explain||'(미작성)'}`,
`비교 — 다르게 해석·평가한 이유: ${s.compare_diff||'(미작성)'}`,
"",
"[4. 내 질문에 답하기]",
`답: ${s.report_answer||'(미작성)'}`,
`근거(자료·표현): ${s.report_evidence||'(미작성)'}`,
`근거가 뒷받침하는 이유: ${s.report_reason||'(미작성)'}`,
`짝과 나눈 뒤 보완: ${s.report_pair||'(미작성)'}`,
"",
"[5. 글쓰기 마무리 생각]",
`${s.closing||'(미작성)'}`,
  ];
  return lines.join('\n');
}
function copyReport(){
  const txt = buildPrintout();
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); alert('복사되었습니다. 제출할 곳에 붙여넣기 하세요.'); }
  catch(e){ alert('복사에 실패했습니다. 아래 상자를 길게 눌러 직접 복사해주세요.'); }
  document.body.removeChild(ta);
}

// ---------- interaction handlers ----------
function s(key, val){ state.notes[key]=val; save(); }
function pickD1Ev(v){ state.notes.d1_evidence=v; save(); render(); }
function toggleHintSeen(i){
  const s = state.notes;
  if(!s.d1_hints_seen) s.d1_hints_seen = [];
  const idx = s.d1_hints_seen.indexOf(i);
  if(idx>=0) s.d1_hints_seen.splice(idx,1); else s.d1_hints_seen.push(i);
  save(); render();
}
function finishD1(){
  if(!state.notes.d1_point){ alert('먼저 윤언이가 중요하게 본 점을 짧게라도 적어 주세요.'); return; }
  state.notes.d1_done = true;
  save(); render();
  alert('설명 나눔 완료! 이제 다음 화면으로 넘어갈 수 있습니다.');
}
function toggleD2(i){
  const arr = state.notes.d2_words;
  const idx = arr.indexOf(i);
  if(idx>=0) arr.splice(idx,1); else arr.push(i);
  save(); render();
}
function pickQ(key){
  state.notes.q_selected = key;
  if(key!=='own'){
    const q = QUESTIONS.find(function(q){ return q.key===key; });
    if(q) state.notes.q_text = q.text;
  }
  save(); render();
}
function toggleEv(key, i){
  const arr = state.notes[key];
  const idx = arr.indexOf(i);
  if(idx>=0) arr.splice(idx,1); else arr.push(i);
  save(); render();
}

const D1_MC = [
  {text:"모든 나라와 사대 관계를 맺는 것 자체", ok:false,
   fb:"다시 읽어봅시다 — 윤언이의 말에는 '도리어'라는 표현과 함께, 구체적으로 어떤 상대가 나옵니다. 그 상대를 다시 찾아보세요."},
  {text:"여진(금)에게 새롭게 신하가 되는 것 ('도리어')", ok:true,
   fb:"맞습니다 — 윤언이는 '도리어'라는 표현으로, 이전과 뒤바뀐 상대(여진)와의 관계를 문제 삼았습니다."},
];

function renderD1MC(){
  const wrap = document.getElementById('d1mc');
  if(!wrap) return;
  wrap.innerHTML = D1_MC.map((o,i)=>`<div class="mc-opt" onclick="checkD1(${i})">${esc(o.text)}</div>`).join('');
  const fb = document.getElementById('d1fb');
  if(fb && state.notes.d1_check){
    const o = D1_MC[state.notes.d1_check==='ok'?1:0];
    fb.innerHTML = `<div class="mc-feedback ${state.notes.d1_check}">${o.fb}</div>`;
  }
}
function checkD1(i){
  state.notes.d1_check = D1_MC[i].ok ? 'ok' : 'recheck';
  save();
  const fb = document.getElementById('d1fb');
  fb.innerHTML = `<div class="mc-feedback ${state.notes.d1_check}">${D1_MC[i].fb}</div>`;
}

// ---------- main render ----------
const SCREENS = [screenTitle, screenMission, screenChapter1, screenChapter2, screenInquiry, screenChapter3, screenChapter4, screenReport, screenClosing];

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen>0) html += floatingTools();
  html += SCREENS[state.screen]();
  app.innerHTML = html;
  if(state.screen===2) renderD1MC();
  if(state.screen===8){
    const po = document.getElementById('printout');
    if(po) po.textContent = buildPrintout();
  }
}
render();

</script>

</body>
</html>
